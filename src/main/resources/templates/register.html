<!DOCTYPE html>
<html lang="en" th:replace="~{base :: parent(~{::#content}, ~{::title}, ~{::script})}">
    <head>
        <title>Signup Page</title>
    </head>
    <body>
        <div id="content">

            <div class="grid grid-cols-12 mt-4">
                <div class="col-span-4 md:col-span-2 lg:col-span-3 xl:col-span-4"></div>
                <div class="col-span-12 md:col-span-8 lg:col-span-6 xl:col-span-4">
                    <!--- Card -->
                    <div 
                    class="bg-white dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-700 block p-6 border-t-[10px] border-blue-700 rounded-xl shadow-xl transition-all duration-300"
                    >
                    <h5 
                        class="mb-2 text-2xl font-semibold tracking-tight text-heading leading-8"
                        >
                        Signup Here
                    </h5>
                    <p class="font-normal text-gray-400 dark:text-gray-400">
                        Start storing contacts on cloud.
                    </p>

                    <!-- This is my form-->
                    <form 
                        data-th-action="@{'/do-register'}" 
                        method="post"
                        data-th-object="${userForm}"
                    >

                    <input type="hidden" data-th-name="${_csrf.parameterName}" data-th-value="${_csrf.token}" />

                    
                        <!-- Name -->

                        <div class="mt-3 mb-2">
                            <label 
                                for="email" 
                                class="block mb-2 text-sm font-medium text-heading"
                                >Name</label>
                                <input 
                                    type="text" 
                                    id="name" 
                                    data-th-field="*{name}"
                                    class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2 shadow-xs 
                                    placeholder:text-body" placeholder="Enter Here" 
                                    required 
                                />
                        </div>

                        <!--Email Field-->
                        <div class="mb-2">
                            <label for="email" 
                                class="block mb-2 text-sm font-medium text-heading"
                                >Email</label>
                                <input 
                                    type="email" 
                                    id="email" 
                                    data-th-field="*{email}"
                                    class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2 shadow-xs placeholder:text-body" 
                                    placeholder="name@flowbite.com" 
                                    required 
                                />
                        </div>

                        <!--Password Field-->
                        <div class="mb-2">
                            <label for="password" 
                                class="block mb-2 text-sm font-medium text-heading"
                                >New Password</label>
                                <input 
                                    type="password" 
                                    id="password" 
                                    data-th-field="*{password}"
                                    class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2 shadow-xs placeholder:text-body" 
                                    placeholder="" 
                                    required 
                                />
                        </div>

                        <!--Contact Field-->
                        <div class="mb-2">
                            <label for="phone" 
                                class="block mb-2 text-sm font-medium text-heading"
                                >Contact Number</label>
                                <input 
                                    type="text" 
                                    id="phone" 
                                    data-th-field="*{phoneNumber}"
                                    class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2 shadow-xs placeholder:text-body" 
                                    placeholder="" 
                                    required 
                                />
                        </div>
                        
                        <!--About-->
                        <div class="mb-2">
                            
                            <label 
                                for="about" 
                                class="block mb-2.5 text-sm font-medium text-heading"
                                >Write something about yourself</label>
                            <textarea 
                                id="about" 
                                rows="2" 
                                data-th-field="*{about}"
                                class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full p-3.5 shadow-xs placeholder:text-body" 
                                placeholder="Write here..."
                                ></textarea>
                        </div>

                        <!--Button-->
                        <div class="mb-2 flex justify-center space-x-3">
                            <button type="submit"
                                class="px-3 py-2 rounded bg-gray-700 hover:bg-gray-800 text-white dark:bg-blue-700 dark:hover:bg-blue-800">
                                Signup
                            </button>
                            <button type="reset" 
                                class="px-3 py-2 rounded bg-orange-700 hover:bg-orange-800 text-white dark:bg-orange-700 dark:hover:bg-orange-800">
                                Reset
                            </button>
                        </div>
                    </form>
                </div>
                </div>
            </div>
        </div>
        <script>
            console.log("Signup");
        </script>
        
    </body>
</html>

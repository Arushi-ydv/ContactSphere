
<!DOCTYPE html>
<html lang="en"
      th:replace="~{base :: parent(~{::#content}, ~{::title}, ~{::script})}">

<head>
    <title>Signup | ContactSphere</title>
</head>

<body>

<div id="content">

    <div class="min-h-[75vh] flex items-center justify-center px-4 py-10">

        <div class="w-full max-w-lg">

            <!-- Registration Card -->
            <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl shadow-xl overflow-hidden">

                <div class="p-7 sm:p-9">

                    <!-- Header -->
                    <div class="text-center mb-8">

                        <div class="w-16 h-16 mx-auto mb-4 flex items-center justify-center rounded-2xl bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400 text-3xl">
                            👤
                        </div>

                        <h1 class="text-3xl font-bold text-gray-900 dark:text-white">
                            Create Account
                        </h1>

                        <p class="mt-2 text-gray-500 dark:text-gray-400">
                            Join ContactSphere and manage your contacts easily.
                        </p>

                    </div>

                    <!-- Registration Form -->
                    <form th:action="@{/do-register}"
                          method="post"
                          th:object="${userForm}"
                          class="space-y-5">

                        <!-- CSRF Token -->
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <!-- Name -->
                        <div>
                            <label for="name"
                                   class="block mb-2 text-sm font-semibold text-gray-700 dark:text-gray-300">
                                Full Name
                            </label>

                            <input type="text"
                                   id="name"
                                   th:field="*{name}"
                                   placeholder="Enter your full name"
                                   required
                                   autocomplete="name"
                                   class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                        </div>

                        <!-- Email -->
                        <div>
                            <label for="email"
                                   class="block mb-2 text-sm font-semibold text-gray-700 dark:text-gray-300">
                                Email Address
                            </label>

                            <input type="email"
                                   id="email"
                                   th:field="*{email}"
                                   placeholder="name@example.com"
                                   required
                                   autocomplete="email"
                                   class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                        </div>

                        <!-- Password -->
                        <div>
                            <label for="password"
                                   class="block mb-2 text-sm font-semibold text-gray-700 dark:text-gray-300">
                                Create Password
                            </label>

                            <input type="password"
                                   id="password"
                                   th:field="*{password}"
                                   placeholder="Enter your password"
                                   required
                                   autocomplete="new-password"
                                   class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                        </div>

                        <!-- Contact Number -->
                        <div>
                            <label for="phoneNumber"
                                   class="block mb-2 text-sm font-semibold text-gray-700 dark:text-gray-300">
                                Contact Number
                            </label>

                            <input type="text"
                                   id="phoneNumber"
                                   th:field="*{phoneNumber}"
                                   placeholder="Enter your phone number"
                                   required
                                   autocomplete="tel"
                                   class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                        </div>

                        <!-- About -->
                        <div>
                            <label for="about"
                                   class="block mb-2 text-sm font-semibold text-gray-700 dark:text-gray-300">
                                About Yourself
                            </label>

                            <textarea id="about"
                                      th:field="*{about}"
                                      rows="3"
                                      placeholder="Tell us something about yourself..."
                                      class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition resize-y"></textarea>
                        </div>

                        <!-- Buttons -->
                        <div class="flex flex-col sm:flex-row gap-3 pt-2">

                            <button type="submit"
                                    class="flex-1 px-5 py-3 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold transition-colors">
                                Create Account
                            </button>

                            <button type="reset"
                                    class="px-5 py-3 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-800 dark:text-white font-semibold transition-colors">
                                Reset
                            </button>

                        </div>

                    </form>

                </div>

                <!-- Bottom Section -->
                <div class="px-7 py-5 sm:px-9 bg-gray-50 dark:bg-gray-800/70 border-t border-gray-200 dark:border-gray-700 text-center">

                    <p class="text-sm text-gray-500 dark:text-gray-400">
                        Already have an account?
                        <a th:href="@{/login}"
                           class="font-semibold text-blue-600 dark:text-blue-400 hover:underline">
                            Login here
                        </a>
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

<script>
    console.log("Signup Page");
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en"
      th:replace="~{base :: parent(~{::#content}, ~{::title}, ~{::script})}">

<head>
    <title>Send Email</title>
</head>

<body>

<div id="content">

    <div class="max-w-3xl mx-auto mt-6">

        <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-xl">

            <h1 class="text-2xl font-semibold text-heading mb-6">
                Send Email
            </h1>

            <form th:action="@{/email/send}"
                  method="post"
                  enctype="multipart/form-data">

                <!-- Recipient Email -->

                <div class="mb-4">

                    <label for="to"
                           class="block mb-2 text-sm font-medium text-heading">

                        To

                    </label>

                    <input type="email"
                           id="to"
                           name="to"
                           required
                           placeholder="Enter recipient email"
                           class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base block w-full px-3 py-2">

                </div>


                <!-- Subject -->

                <div class="mb-4">

                    <label for="subject"
                           class="block mb-2 text-sm font-medium text-heading">

                        Subject

                    </label>

                    <input type="text"
                           id="subject"
                           name="subject"
                           required
                           placeholder="Enter subject"
                           class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base block w-full px-3 py-2">

                </div>


                <!-- Message -->

                <div class="mb-4">

                    <label for="message"
                           class="block mb-2 text-sm font-medium text-heading">

                        Message

                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                        placeholder="Write your message"
                        class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base block w-full px-3 py-2">
                    </textarea>

                </div>


                <!-- Attachment -->

                <div class="mb-6">

                    <label for="attachment"
                           class="block mb-2 text-sm font-medium text-heading">

                        Attachment

                    </label>

                    <input type="file"
                           id="attachment"
                           name="attachment"
                           class="block w-full text-sm">

                </div>


                <!-- Send Button -->

                <button type="submit"
                        class="text-white bg-blue-600 hover:bg-blue-700 font-medium rounded-lg text-sm px-5 py-2.5">

                    Send Email

                </button>

            </form>

        </div>

    </div>

</div>


<script>

    console.log("Send Email Page");

</script>

</body>
</html>

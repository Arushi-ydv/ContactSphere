
<!DOCTYPE html>
<html lang="en"
      th:replace="~{base :: parent(~{::#content}, ~{::title}, ~{::script})}">

<head>
    <title>Send Email | ContactSphere</title>
</head>

<body>

<div id="content">

    <div class="max-w-4xl mx-auto px-4 py-10">

        <!-- Header -->
        <div class="mb-8">
            <p class="text-sm font-semibold uppercase tracking-wider text-blue-600 dark:text-blue-400 mb-2">
                Communication
            </p>

            <h1 class="text-3xl font-bold text-gray-900 dark:text-white">
                Send an Email
            </h1>

            <p class="mt-2 text-gray-500 dark:text-gray-400">
                Compose and send an email directly to your contact.
            </p>
        </div>

        <!-- Email Form -->
        <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl shadow-lg p-6 sm:p-8">

            <form th:action="@{/email/send}"
                  method="post"
                  enctype="multipart/form-data"
                  th:object="${emailForm}"
                  class="space-y-6">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <!-- Recipient -->
                <div>
                    <label for="to"
                           class="block text-sm font-semibold text-gray-700 dark:text-gray-200 mb-2">
                        Recipient Email
                    </label>

                    <input type="email"
                           id="to"
                           th:field="*{to}"
                           required
                           placeholder="example@email.com"
                           class="w-full rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 px-4 py-3 text-gray-900 dark:text-white outline-none focus:ring-2 focus:ring-blue-500">

                    <p th:if="${#fields.hasErrors('to')}"
                       th:errors="*{to}"
                       class="text-sm text-red-500 mt-1"></p>
                </div>

                <!-- Subject -->
                <div>
                    <label for="subject"
                           class="block text-sm font-semibold text-gray-700 dark:text-gray-200 mb-2">
                        Subject
                    </label>

                    <input type="text"
                           id="subject"
                           th:field="*{subject}"
                           required
                           placeholder="Enter email subject"
                           class="w-full rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 px-4 py-3 text-gray-900 dark:text-white outline-none focus:ring-2 focus:ring-blue-500">

                    <p th:if="${#fields.hasErrors('subject')}"
                       th:errors="*{subject}"
                       class="text-sm text-red-500 mt-1"></p>
                </div>

                <!-- Message -->
                <div>
                    <label for="message"
                           class="block text-sm font-semibold text-gray-700 dark:text-gray-200 mb-2">
                        Message
                    </label>

                    <textarea id="message"
                              th:field="*{message}"
                              rows="7"
                              required
                              placeholder="Write your email message here..."
                              class="w-full rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 px-4 py-3 text-gray-900 dark:text-white outline-none focus:ring-2 focus:ring-blue-500 resize-y"></textarea>

                    <p th:if="${#fields.hasErrors('message')}"
                       th:errors="*{message}"
                       class="text-sm text-red-500 mt-1"></p>
                </div>

                <!-- Attachment -->
                <div>
                    <label for="attachment"
                           class="block text-sm font-semibold text-gray-700 dark:text-gray-200 mb-2">
                        Attachment <span class="font-normal text-gray-400">(Optional)</span>
                    </label>

                    <input type="file"
                           id="attachment"
                           name="attachment"
                           class="block w-full text-sm text-gray-600 dark:text-gray-300 file:mr-4 file:rounded-lg file:border-0 file:bg-blue-50 dark:file:bg-blue-900/40 file:px-4 file:py-2 file:font-medium file:text-blue-700 dark:file:text-blue-300 hover:file:bg-blue-100">
                </div>

                <!-- Submit -->
                <div class="flex flex-col sm:flex-row gap-3 pt-2">

                    <button type="submit"
                            class="inline-flex items-center justify-center gap-2 rounded-xl bg-blue-600 px-6 py-3 text-sm font-semibold text-white hover:bg-blue-700 transition">
                        <span>✉</span>
                        Send Email
                    </button>

                    <a th:href="@{/contacts}"
                       class="inline-flex items-center justify-center rounded-xl border border-gray-300 dark:border-gray-600 px-6 py-3 text-sm font-semibold text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

        <p class="mt-5 text-center text-sm text-gray-500 dark:text-gray-400">
            Make sure the recipient email address is correct before sending.
        </p>

    </div>

</div>

<script>
    console.log("Send Email Page");
</script>

</body>
</html>

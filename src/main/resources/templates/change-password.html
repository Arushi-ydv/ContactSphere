<!DOCTYPE html>
<html lang="en"
      th:replace="~{base :: parent(~{::#content}, ~{::title}, ~{::script})}">

<head>
    <title>Change Password</title>
</head>

<body>

<div id="content">

    <div class="max-w-3xl mx-auto mt-6">

        <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-xl">

            <h1 class="text-2xl font-semibold text-heading mb-6">
                Change Password
            </h1>

            <form th:action="@{/settings/change-password}" method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <!-- Current Password -->
                <div class="mb-4">

                    <label for="currentPassword"
                           class="block mb-2 text-sm font-medium text-heading">
                        Current Password
                    </label>

                    <input type="password"
                           id="currentPassword"
                           name="currentPassword"
                           required
                           class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base block w-full px-3 py-2">

                </div>

                <!-- New Password -->
                <div class="mb-4">

                    <label for="newPassword"
                           class="block mb-2 text-sm font-medium text-heading">
                        New Password
                    </label>

                    <input type="password"
                           id="newPassword"
                           name="newPassword"
                           required
                           class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base block w-full px-3 py-2">

                </div>

                <!-- Confirm New Password -->
                <div class="mb-6">

                    <label for="confirmPassword"
                           class="block mb-2 text-sm font-medium text-heading">
                        Confirm New Password
                    </label>

                    <input type="password"
                           id="confirmPassword"
                           name="confirmPassword"
                           required
                           class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base block w-full px-3 py-2">

                </div>

                <!-- Buttons -->
                <div class="flex gap-3">

                    <button type="submit"
                            class="text-white bg-blue-600 hover:bg-blue-700 font-medium rounded-lg text-sm px-5 py-2.5">
                        Change Password
                    </button>

                    <a th:href="@{/settings}"
                       class="text-white bg-gray-600 hover:bg-gray-700 font-medium rounded-lg text-sm px-5 py-2.5">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

<script>
    console.log("Change Password Page");
</script>

</body>
</html>


<nav data-th-fragment="navbar"
     class="bg-white dark:bg-gray-900 shadow-sm fixed w-full z-20 top-0 left-0
     border-b border-gray-200 dark:border-gray-700">

    <div class="max-w-screen-xl flex flex-wrap items-center justify-between
        mx-auto px-4 py-3">

        <!-- Logo -->
        <a href="/" class="flex items-center gap-3">

            <img data-th-src="@{'/images/phone.png'}"
                 class="h-8 w-8 object-contain rounded"
                 alt="ContactSphere Logo">

            <span class="text-xl font-bold whitespace-nowrap
                text-gray-900 dark:text-white">
                ContactSphere
            </span>

        </a>

        <!-- Right Side -->
        <div class="flex items-center gap-2 sm:gap-3 md:order-2">

            <!-- Theme Toggle -->
            <button
                id="theme_change_button"
                type="button"
                class="inline-flex items-center gap-2 px-3 py-2
                rounded-lg text-sm font-medium
                bg-gray-100 text-gray-800
                hover:bg-gray-200
                dark:bg-gray-700 dark:text-white dark:hover:bg-gray-600
                transition-colors">

                <i class="fa-solid fa-circle-half-stroke"></i>
                <span>Dark</span>

            </button>

            <!-- Guest User -->
            <div th:if="${loggedInUser == null}"
                 class="flex items-center gap-2">

                <a data-th-href="@{'/login'}"
                   class="text-white bg-gray-800 hover:bg-gray-900
                   dark:bg-blue-600 dark:hover:bg-blue-700
                   font-medium rounded-lg text-sm px-3 sm:px-4 py-2
                   transition-colors">
                    Login
                </a>

                <a data-th-href="@{'/register'}"
                   class="text-white bg-blue-600 hover:bg-blue-700
                   font-medium rounded-lg text-sm px-3 sm:px-4 py-2
                   transition-colors">
                    Signup
                </a>

            </div>

            <!-- Logged-in User -->
            <div th:if="${loggedInUser != null}"
                 class="flex items-center gap-2">

                <span class="hidden lg:inline text-sm font-medium
                    text-gray-700 dark:text-gray-200">
                    Welcome,
                    <span th:text="${loggedInUser}"></span>
                </span>

                <a th:href="@{/profile}"
                   class="text-white bg-blue-600 hover:bg-blue-700
                   font-medium rounded-lg text-sm px-3 py-2
                   transition-colors">
                    Profile
                </a>

                <a th:href="@{/settings}"
                   class="hidden sm:inline-block text-white
                   bg-gray-600 hover:bg-gray-700
                   font-medium rounded-lg text-sm px-3 py-2
                   transition-colors">
                    Settings
                </a>

                <form th:action="@{/logout}" method="post">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <button type="submit"
                            class="text-white bg-red-600 hover:bg-red-700
                            font-medium rounded-lg text-sm px-3 py-2
                            transition-colors">
                        Logout
                    </button>

                </form>

            </div>

            <!-- Mobile Menu Button -->
            <button
                data-collapse-toggle="navbar-cta"
                type="button"
                aria-controls="navbar-cta"
                aria-expanded="false"
                class="inline-flex items-center justify-center
                w-10 h-10 p-2 rounded-lg md:hidden
                text-gray-600 hover:bg-gray-100
                dark:text-gray-300 dark:hover:bg-gray-700
                focus:outline-none focus:ring-2 focus:ring-gray-300
                dark:focus:ring-gray-600">

                <span class="sr-only">Open main menu</span>

                <svg class="w-6 h-6"
                     xmlns="http://www.w3.org/2000/svg"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor">

                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M4 6h16M4 12h16M4 18h16"/>

                </svg>

            </button>

        </div>

        <!-- Navigation Links -->
        <div class="hidden w-full md:flex md:w-auto md:order-1"
             id="navbar-cta">

            <ul class="flex flex-col md:flex-row md:items-center
                gap-1 md:gap-7 mt-4 md:mt-0 p-3 md:p-0
                rounded-lg bg-gray-50 md:bg-transparent
                dark:bg-gray-800 md:dark:bg-transparent
                border border-gray-200 md:border-0
                dark:border-gray-700 md:dark:border-0">

                <li>
                    <a data-th-href="@{'/home'}"
                       class="block px-3 py-2 rounded-lg
                       text-blue-700 dark:text-blue-400
                       hover:bg-gray-100 dark:hover:bg-gray-700
                       md:hover:bg-transparent md:dark:hover:bg-transparent
                       font-semibold">
                        Home
                    </a>
                </li>

                <li>
                    <a data-th-href="@{'/about'}"
                       class="block px-3 py-2 rounded-lg
                       text-gray-700 dark:text-gray-200
                       hover:text-blue-700 dark:hover:text-blue-400
                       hover:bg-gray-100 dark:hover:bg-gray-700
                       md:hover:bg-transparent md:dark:hover:bg-transparent
                       transition-colors">
                        About
                    </a>
                </li>

                <li>
                    <a data-th-href="@{'/services'}"
                       class="block px-3 py-2 rounded-lg
                       text-gray-700 dark:text-gray-200
                       hover:text-blue-700 dark:hover:text-blue-400
                       hover:bg-gray-100 dark:hover:bg-gray-700
                       md:hover:bg-transparent md:dark:hover:bg-transparent
                       transition-colors">
                        Services
                    </a>
                </li>

                <li>
                    <a data-th-href="@{'/contact'}"
                       class="block px-3 py-2 rounded-lg
                       text-gray-700 dark:text-gray-200
                       hover:text-blue-700 dark:hover:text-blue-400
                       hover:bg-gray-100 dark:hover:bg-gray-700
                       md:hover:bg-transparent md:dark:hover:bg-transparent
                       transition-colors">
                        Contact
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>

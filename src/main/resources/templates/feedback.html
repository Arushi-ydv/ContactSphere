<!DOCTYPE html>
<html lang="en"
      th:replace="~{base :: parent(~{::#content}, ~{::title}, ~{::script})}">

<head>
    <title>Feedback - ContactSphere</title>
</head>

<body>

<div id="content">

    <div class="max-w-screen-md mx-auto px-4 py-10">

        <div class="bg-slate-800 rounded-xl p-8 shadow-lg">

            <h1 class="text-3xl font-bold text-white mb-2">
                Give Your Feedback
            </h1>

            <p class="text-slate-300 mb-8">
                We'd love to hear your thoughts about ContactSphere.
            </p>

            <form th:action="@{/feedback}"
                  method="post"
                  th:object="${feedbackForm}"
                  class="space-y-6">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <!-- Name -->
                <div>
                    <label class="block text-sm font-medium text-white mb-2">
                        Name
                    </label>

                    <input type="text"
                           th:field="*{name}"
                           class="w-full rounded-lg bg-slate-700 border border-slate-600 text-white px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                           placeholder="Enter your name">

                    <p th:if="${#fields.hasErrors('name')}"
                       th:errors="*{name}"
                       class="text-red-400 text-sm mt-2">
                    </p>
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-sm font-medium text-white mb-2">
                        Email
                    </label>

                    <input type="email"
                           th:field="*{email}"
                           class="w-full rounded-lg bg-slate-700 border border-slate-600 text-white px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                           placeholder="Enter your email">

                    <p th:if="${#fields.hasErrors('email')}"
                       th:errors="*{email}"
                       class="text-red-400 text-sm mt-2">
                    </p>
                </div>

                <!-- Message -->
                <div>
                    <label class="block text-sm font-medium text-white mb-2">
                        Feedback
                    </label>

                    <textarea th:field="*{message}"
                              rows="6"
                              class="w-full rounded-lg bg-slate-700 border border-slate-600 text-white px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                              placeholder="Write your feedback here..."></textarea>

                    <p th:if="${#fields.hasErrors('message')}"
                       th:errors="*{message}"
                       class="text-red-400 text-sm mt-2">
                    </p>
                </div>

                <button type="submit"
                        class="px-6 py-3 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold transition">
                    Submit Feedback
                </button>

            </form>

        </div>

    </div>

</div>

<script>
    console.log("Feedback page");
</script>

</body>
</html>

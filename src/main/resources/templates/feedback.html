
<!DOCTYPE html>
<html lang="en"
      th:replace="~{base :: parent(~{::#content}, ~{::title}, ~{::script})}">

<head>
    <title>Feedback | ContactSphere</title>
</head>

<body>

<div id="content">

    <div class="max-w-3xl mx-auto px-4 py-12">

        <!-- Header -->
        <div class="text-center mb-8">

            <div class="w-16 h-16 mx-auto mb-4 flex items-center justify-center rounded-2xl bg-blue-100 dark:bg-blue-900/40 text-3xl">
                💬
            </div>

            <p class="text-sm font-semibold uppercase tracking-wider text-blue-600 dark:text-blue-400 mb-2">
                Your Opinion Matters
            </p>

            <h1 class="text-3xl sm:text-4xl font-bold text-gray-900 dark:text-white">
                Share Your Feedback
            </h1>

            <p class="mt-3 text-gray-500 dark:text-gray-400">
                We'd love to hear your thoughts and suggestions about ContactSphere.
            </p>

        </div>

        <!-- Feedback Form Card -->
        <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl shadow-lg p-6 sm:p-8">

            <form th:action="@{/feedback}"
                  method="post"
                  th:object="${feedbackForm}"
                  class="space-y-6">

                <!-- CSRF -->
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <!-- Name -->
                <div>
                    <label for="name"
                           class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">
                        Your Name
                    </label>

                    <input type="text"
                           id="name"
                           th:field="*{name}"
                           placeholder="Enter your name"
                           class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">

                    <p th:if="${#fields.hasErrors('name')}"
                       th:errors="*{name}"
                       class="text-red-500 text-sm mt-2">
                    </p>
                </div>

                <!-- Email -->
                <div>
                    <label for="email"
                           class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">
                        Email Address
                    </label>

                    <input type="email"
                           id="email"
                           th:field="*{email}"
                           placeholder="name@example.com"
                           class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">

                    <p th:if="${#fields.hasErrors('email')}"
                       th:errors="*{email}"
                       class="text-red-500 text-sm mt-2">
                    </p>
                </div>

                <!-- Message -->
                <div>
                    <label for="message"
                           class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">
                        Your Feedback
                    </label>

                    <textarea id="message"
                              th:field="*{message}"
                              rows="6"
                              placeholder="Tell us about your experience, suggestions or improvements..."
                              class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition resize-y"></textarea>

                    <p th:if="${#fields.hasErrors('message')}"
                       th:errors="*{message}"
                       class="text-red-500 text-sm mt-2">
                    </p>
                </div>

                <!-- Submit -->
                <div class="pt-2">
                    <button type="submit"
                            class="w-full inline-flex items-center justify-center gap-2 px-6 py-3 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold transition-colors shadow-sm">
                        Submit Feedback
                        <span>→</span>
                    </button>
                </div>

            </form>

        </div>

        <p class="text-center text-sm text-gray-500 dark:text-gray-400 mt-6">
            Thank you for helping us improve ContactSphere!
        </p>

    </div>

</div>

<script>
    console.log("Feedback page");
</script>

</body>
</html>

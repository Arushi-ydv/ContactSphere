<!DOCTYPE html>
<html lang="en"
      th:replace="~{base :: parent(~{::#content}, ~{::title}, ~{::script})}">

<head>
    <title>My Contacts</title>
</head>

<body>

<div id="content">

    <div class="max-w-screen-xl mx-auto px-4 py-8">

        <div class="mb-6">

    <div class="flex items-center justify-between mb-4">

        <h1 class="text-3xl font-bold text-gray-900 dark:text-white">
            My Contacts
        </h1>

        <div class="flex gap-2">

    <a th:href="@{/contacts/export/excel}"
       class="text-white bg-green-600 hover:bg-green-700 font-medium rounded-lg text-sm px-4 py-2">
        Export Excel
    </a>

    <a th:href="@{/contacts/export/pdf}"
       class="text-white bg-red-600 hover:bg-red-700 font-medium rounded-lg text-sm px-4 py-2">
        Export PDF
    </a>

    <a th:href="@{/contacts/add}"
       class="text-white bg-blue-700 hover:bg-blue-800 font-medium rounded-lg text-sm px-4 py-2">
        Add Contact
    </a>

</div>
    </div>

    <!-- Search -->
    <form th:action="@{/contacts}"
          method="get"
          class="flex gap-2">

        <input type="text"
               name="keyword"
               th:value="${keyword}"
               placeholder="Search contacts..."
               class="flex-1 px-3 py-2 border rounded-lg bg-white text-gray-900 dark:bg-gray-700 dark:text-white">

        <button type="submit"
                class="text-white bg-blue-700 hover:bg-blue-800 font-medium rounded-lg text-sm px-5 py-2">
            Search
        </button>

    </form>

</div>

        <!-- No contacts -->
        <div th:if="${#lists.isEmpty(contacts)}"
             class="text-gray-500 dark:text-gray-300">
            No contacts found.
        </div>

        <!-- Contact cards -->
        <div th:unless="${#lists.isEmpty(contacts)}"
             class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

            <div th:each="contact : ${contacts}"
                 class="bg-white dark:bg-gray-800 rounded-xl shadow p-5">

                <a th:href="@{'/contacts/' + ${contact.id}}"
                    class="text-xl font-semibold text-gray-900 dark:text-white hover:text-blue-600">
                    <span th:text="${contact.name}">Contact Name</span>
                </a>

                <p class="text-gray-500 mt-2"
                   th:text="${contact.email}">
                    Email
                </p>

                <p class="text-gray-500 mt-1"
                   th:text="${contact.phoneNumber}">
                    Phone
                </p>

            </div>

        </div>

         <!-- Pagination -->
        <div th:if="${totalPages > 1}"
             class="flex justify-center gap-2 mt-8">

            <!-- Previous button -->
            <a th:if="${currentPage > 0}"
               th:href="@{/contacts(page=${currentPage - 1}, keyword=${keyord})}"
               class="px-4 py-2 bg-blue-700 text-white rounded-lg">
                Previous
            </a>


            <!-- Page numbers -->
            <a th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
               th:href="@{/contacts(page=${i}, keyword=${keyword})}"
               th:text="${i + 1}"
               class="px-4 py-2 rounded-lg bg-gray-700 text-white">
            </a>


            <!-- Next button -->
            <a th:if="${currentPage < totalPages - 1}"
               th:href="@{/contacts(page=${currentPage + 1}, keyword=${keyword})}"
               class="px-4 py-2 bg-blue-700 text-white rounded-lg">
                Next
            </a>

        </div>

    </div>

</div>

<script>
    console.log("Contacts page");
</script>

</body>
</html>

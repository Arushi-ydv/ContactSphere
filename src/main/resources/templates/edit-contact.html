<!DOCTYPE html>
<html lang="en"
      th:replace="~{base :: parent(~{::#content}, ~{::title}, ~{::script})}">

<head>
    <title>Edit Contact</title>
</head>

<body>

<div id="content">

    <div class="max-w-screen-md mx-auto px-4 py-8">

        <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-6">
            Edit Contact
        </h1>

        <form th:action="@{/contacts/{id}/update(id=${contact.id})}"
              th:object="${contactForm}"
              method="post"
              class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow">

            <!-- CSRF -->
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <!-- Name -->
            <div class="mb-4">
                <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                    Name
                </label>

                <input type="text"
                       th:field="*{name}"
                       class="w-full px-3 py-2 border rounded-lg bg-white text-gray-900 dark:bg-gray-700 dark:text-white"
                       placeholder="Enter contact name">

                <p th:if="${#fields.hasErrors('name')}"
                   th:errors="*{name}"
                   class="text-red-500 text-sm mt-1">
                </p>
            </div>

            <!-- Email -->
            <div class="mb-4">
                <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                    Email
                </label>

                <input type="email"
                       th:field="*{email}"
                       class="w-full px-3 py-2 border rounded-lg bg-white text-gray-900 dark:bg-gray-700 dark:text-white"
                       placeholder="Enter email">

                <p th:if="${#fields.hasErrors('email')}"
                   th:errors="*{email}"
                   class="text-red-500 text-sm mt-1">
                </p>
            </div>

            <!-- Phone -->
            <div class="mb-4">
                <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                    Phone Number
                </label>

                <input type="text"
                       th:field="*{phoneNumber}"
                       class="w-full px-3 py-2 border rounded-lg bg-white text-gray-900 dark:bg-gray-700 dark:text-white"
                       placeholder="Enter phone number">

                <p th:if="${#fields.hasErrors('phoneNumber')}"
                   th:errors="*{phoneNumber}"
                   class="text-red-500 text-sm mt-1">
                </p>
            </div>

            <!-- Address -->
            <div class="mb-4">
                <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                    Address
                </label>

                <input type="text"
                       th:field="*{address}"
                       class="w-full px-3 py-2 border rounded-lg bg-white text-gray-900 dark:bg-gray-700 dark:text-white"
                       placeholder="Enter address">

                <p th:if="${#fields.hasErrors('address')}"
                   th:errors="*{address}"
                   class="text-red-500 text-sm mt-1">
                </p>
            </div>

            <!-- Description -->
            <div class="mb-4">
                <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                    Description
                </label>

                <textarea th:field="*{description}"
                          rows="4"
                          class="w-full px-3 py-2 border rounded-lg bg-white text-gray-900 dark:bg-gray-700 dark:text-white"
                          placeholder="Write something about this contact"></textarea>

                <p th:if="${#fields.hasErrors('description')}"
                   th:errors="*{description}"
                   class="text-red-500 text-sm mt-1">
                </p>
            </div>

            <!-- Website -->
            <div class="mb-4">
                <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                    Website
                </label>

                <input type="url"
                       th:field="*{websiteLink}"
                       class="w-full px-3 py-2 border rounded-lg bg-white text-gray-900 dark:bg-gray-700 dark:text-white"
                       placeholder="https://example.com">

                <p th:if="${#fields.hasErrors('websiteLink')}"
                   th:errors="*{websiteLink}"
                   class="text-red-500 text-sm mt-1">
                </p>
            </div>

            <!-- LinkedIn -->
            <div class="mb-5">
                <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                    LinkedIn
                </label>

                <input type="url"
                       th:field="*{linkedInLink}"
                       class="w-full px-3 py-2 border rounded-lg bg-white text-gray-900 dark:bg-gray-700 dark:text-white"
                       placeholder="https://linkedin.com/in/example">

                <p th:if="${#fields.hasErrors('linkedInLink')}"
                   th:errors="*{linkedInLink}"
                   class="text-red-500 text-sm mt-1">
                </p>
            </div>

            <!-- Buttons -->
            <div class="flex gap-3">

                <button type="submit"
                        class="text-white bg-blue-700 hover:bg-blue-800 font-medium rounded-lg text-sm px-5 py-2.5">
                    Update Contact
                </button>

                <a th:href="@{/contacts/{id}(id=${contact.id})}"
                   class="text-white bg-gray-700 hover:bg-gray-800 font-medium rounded-lg text-sm px-5 py-2.5">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

<script>
    console.log("Edit Contact page");
</script>

</body>
</html>

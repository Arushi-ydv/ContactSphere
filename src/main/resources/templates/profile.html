<!DOCTYPE html>
<html lang="en"
      th:replace="~{base :: parent(~{::#content}, ~{::title}, ~{::script})}">

<head>
    <title>My Profile</title>
</head>

<body>

<div id="content">

    <div class="max-w-3xl mx-auto mt-6">

        <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-xl">

            <!-- Profile Picture -->
            <div class="mb-6">
                <img th:src="${user.profilePic}"
                    alt="Profile Picture"
                    class="w-32 h-32 rounded-full object-cover border-2 border-gray-400">
            </div>

            <div class="flex items-center justify-between mb-6">

                <h1 class="text-2xl font-semibold text-heading">
                    My Profile
                </h1>

                <a th:href="@{/profile/edit}"
                    class="text-white bg-blue-600 hover:bg-blue-700 font-medium rounded-lg text-sm px-4 py-2">
                        Edit Profile
                </a>

            </div>

            <!-- Name -->
            <div class="mb-4">
                <p class="text-gray-400 text-sm">Name</p>
                <p class="text-heading font-medium"
                   th:text="${user.name}">
                </p>
            </div>

            <!-- Email -->
            <div class="mb-4">
                <p class="text-gray-400 text-sm">Email</p>
                <p class="text-heading font-medium"
                   th:text="${user.email}">
                </p>
            </div>

            <!-- Phone Number -->
            <div class="mb-4">
                <p class="text-gray-400 text-sm">Phone Number</p>
                <p class="text-heading font-medium"
                   th:text="${user.phoneNumber}">
                </p>
            </div>

            <!-- About -->
            <div class="mb-4">
                <p class="text-gray-400 text-sm">About</p>
                <p class="text-heading font-medium"
                   th:text="${user.about}">
                </p>
            </div>

            <!-- Provider -->
            <div class="mb-4">
                <p class="text-gray-400 text-sm">Login Provider</p>
                <p class="text-heading font-medium"
                   th:text="${user.provider}">
                </p>
            </div>

        </div>

    </div>

</div>

<script>
    console.log("Profile Page");
</script>

</body>
</html>

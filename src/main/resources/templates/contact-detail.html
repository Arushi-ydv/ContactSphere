<!DOCTYPE html>
<html lang="en"
      th:replace="~{base :: parent(~{::#content}, ~{::title}, ~{::script})}">

<head>
    <title>Contact Details</title>
</head>

<body>

<div id="content">

    <div class="max-w-screen-md mx-auto px-4 py-8">

        <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-6">

            <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-6"
                th:text="${contact.name}">
                Contact Name
            </h1>

            <div class="space-y-4">

                <div>
                    <p class="text-sm text-gray-500">Email</p>
                    <p class="text-lg text-gray-900 dark:text-white"
                       th:text="${contact.email}">
                        Email
                    </p>
                </div>

                <div>
                    <p class="text-sm text-gray-500">Phone</p>
                    <p class="text-lg text-gray-900 dark:text-white"
                       th:text="${contact.phoneNumber}">
                        Phone
                    </p>
                </div>

                <div>
                    <p class="text-sm text-gray-500">Address</p>
                    <p class="text-lg text-gray-900 dark:text-white"
                       th:text="${contact.address}">
                        Address
                    </p>
                </div>

                <div>
                    <p class="text-sm text-gray-500">Description</p>
                    <p class="text-lg text-gray-900 dark:text-white"
                       th:text="${contact.description}">
                        Description
                    </p>
                </div>

                <div>
                    <p class="text-sm text-gray-500">Favourite</p>
                    <p class="text-lg text-gray-900 dark:text-white"
                       th:text="${contact.favourite ? 'Yes' : 'No'}">
                        No
                    </p>
                </div>

            </div>

            <!-- Social Links -->
<div class="mt-8">

    <h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-4">
        Social Links
    </h2>

    <!-- Existing Social Links -->
    <div th:if="${!#lists.isEmpty(contact.links)}"
         class="space-y-2 mb-5">

        <div th:each="socialLink : ${contact.links}"
     class="flex items-center justify-between bg-gray-100 dark:bg-gray-700 p-3 rounded-lg">

    <span class="font-medium text-gray-900 dark:text-white"
          th:text="${socialLink.title}">
        LinkedIn
    </span>

    <div class="flex items-center gap-3">

        <a th:href="${socialLink.link}"
           target="_blank"
           class="text-blue-600 hover:underline">
            Open
        </a>

        <form th:action="@{'/contacts/' + ${contact.id} +
                           '/social-links/' + ${socialLink.id} + '/delete'}"
              method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button type="submit"
                    class="text-red-600 hover:text-red-800 font-medium">
                Delete
            </button>

        </form>

    </div>

</div>

    </div>

    <!-- Add Social Link Form -->
    <form th:action="@{'/contacts/' + ${contact.id} + '/social-links'}"
          method="post"
          class="space-y-3">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <input type="text"
               name="title"
               placeholder="Platform name (LinkedIn, GitHub...)"
               required
               class="w-full px-3 py-2 border rounded-lg bg-white text-gray-900 dark:bg-gray-700 dark:text-white">

        <input type="url"
               name="link"
               placeholder="https://..."
               required
               class="w-full px-3 py-2 border rounded-lg bg-white text-gray-900 dark:bg-gray-700 dark:text-white">

        <button type="submit"
                class="text-white bg-blue-700 hover:bg-blue-800 font-medium rounded-lg text-sm px-4 py-2">
            Add Social Link
        </button>

    </form>

</div>

            <div class="mt-6 flex gap-3">

                <a th:href="@{'/contacts/' + ${contact.id} + '/edit'}"
                    class="text-white bg-blue-700 hover:bg-blue-800 font-medium rounded-lg text-sm px-4 py-2">
                    Edit Contact
                </a>

                <!-- Favourite -->
                <form th:action="@{'/contacts/' + ${contact.id} + '/favourite'}"
                    method="post">

                    <input type="hidden"
                    th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}">

                    <button type="submit"
                        class="text-white bg-yellow-500 hover:bg-yellow-600 font-medium rounded-lg text-sm px-4 py-2">

                        <span th:text="${contact.favourite ? '★ Unfavourite' : '☆ Favourite'}">
                            ☆ Favourite
                        </span>

                    </button>

                </form>

                <form th:action="@{'/contacts/' + ${contact.id} + '/delete'}" method="post">
                    <input type="hidden"
                            th:name="${_csrf.parameterName}"
                            th:value="${_csrf.token}">

                    <button type="submit"
                            class="text-white bg-red-700 hover:bg-red-800 font-medium rounded-lg text-sm px-4 py-2">
                        Delete Contact
                        </button>
                </form>

                <a th:href="@{/contacts}"
                    class="text-white bg-gray-700 hover:bg-gray-800 font-medium rounded-lg text-sm px-4 py-2">
                    Back to Contacts
                </a>
            </div>

        </div>

    </div>

</div>

<script>
    console.log("Contact Details page");
</script>

</body>
</html>

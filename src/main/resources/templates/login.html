<!DOCTYPE html>
<html lang="en" th:replace="~{base :: parent(~{::#content}, ~{::title}, ~{::script})}">
    <head>
        <title>Login Page</title>
    </head>
    <body>
        <div id="content">

    <div class="grid grid-cols-12 mt-4">

        <!-- Left spacing -->
        <div class="col-span-4 md:col-span-2 lg:col-span-3 xl:col-span-4"></div>

        <!-- Login Card -->
        <div class="col-span-12 md:col-span-8 lg:col-span-6 xl:col-span-4">

            <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-xl">

                <h5 class="mb-2 text-2xl font-semibold text-heading">
                    Login Here
                </h5>

                <p class="font-normal text-gray-400 mb-4">
                    Login to your ContactSphere account.
                </p>

                <form th:action="@{/login}" method="post">

                     <!-- CSRF Token -->
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">
                           
                    <!-- Email -->
                    <div class="mb-4">
                        <label for="username"
                            class="block mb-2 text-sm font-medium text-heading">
                            Email
                        </label>

                        <input
                            type="email"
                            id="username"
                            name="username"
                            placeholder="name@example.com"
                            required
                            class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base block w-full px-3 py-2"
                        >
                    </div>

                    <!-- Password -->
                    <div class="mb-4">
                        <label for="password"
                            class="block mb-2 text-sm font-medium text-heading">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                            class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base block w-full px-3 py-2"
                        >
                    </div>

                    <!-- Login Button -->
                    <div class="mb-2 flex justify-center">
                        <button
                            type="submit"
                            class="px-4 py-2 rounded bg-blue-700 hover:bg-blue-800 text-white">
                            Login
                        </button>
                    </div>

                </form>

                <!-- Google Login -->
                <div class="mt-4">
                    <a href="/oauth2/authorization/google"
                       class="w-full block text-center text-white bg-red-600 hover:bg-red-700 font-medium rounded-lg text-sm px-5 py-2.5">
                        Continue with Google
                    </a>
                </div>

                <!-- GitHub Login -->
                <div class="mt-2">
                    <a href="/oauth2/authorization/github"
                    class="w-full block text-center text-white bg-gray-700 hover:bg-gray-800 font-medium rounded-lg text-sm px-5 py-2.5">
                        Continue with GitHub
                    </a>
                </div>

            </div>

        </div>

    </div>

</div>
        <script>
            console.log("Login");
        </script>
        
    </body>
</html>

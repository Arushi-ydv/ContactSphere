<!DOCTYPE html>
<html lang="en"
      th:replace="~{base :: parent(~{::#content}, ~{::title}, ~{::script})}">

<head>
    <title>Edit Profile</title>
</head>

<body>

<div id="content">

    <div class="max-w-3xl mx-auto mt-6">

        <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-xl">

            <h1 class="text-2xl font-semibold text-heading mb-6">
                Edit Profile
            </h1>

            <!-- Current Profile Picture -->
            <div class="mb-6">
                <img th:src="${user.profilePic}"
                alt="Profile Picture"
                class="w-32 h-32 rounded-full object-cover border-2 border-gray-400">
            </div>

            <form th:action="@{/profile/update}" method="post" enctype="multipart/form-data">

                <!-- CSRF Token -->
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <!-- Name -->
                <div class="mb-4">
                    <label for="name"
                           class="block mb-2 text-sm font-medium text-heading">
                        Name
                    </label>

                    <input type="text"
                           id="name"
                           name="name"
                           th:value="${user.name}"
                           required
                           class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base block w-full px-3 py-2">
                </div>

                <!-- Email -->
                <div class="mb-4">
                    <label for="email"
                           class="block mb-2 text-sm font-medium text-heading">
                        Email
                    </label>

                    <input type="email"
                           id="email"
                           name="email"
                           th:value="${user.email}"
                           readonly
                           class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base block w-full px-3 py-2">
                </div>

                <!-- Phone Number -->
                <div class="mb-4">
                    <label for="phoneNumber"
                           class="block mb-2 text-sm font-medium text-heading">
                        Phone Number
                    </label>

                    <input type="text"
                           id="phoneNumber"
                           name="phoneNumber"
                           th:value="${user.phoneNumber}"
                           class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base block w-full px-3 py-2">
                </div>

                <!-- About -->
                <div class="mb-4">
                    <label for="about"
                           class="block mb-2 text-sm font-medium text-heading">
                        About
                    </label>

                    <textarea id="about"
                              name="about"
                              rows="4"
                              class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base block w-full px-3 py-2"
                              th:text="${user.about}"></textarea>
                </div>

                <!-- Profile Picture -->
<div class="mb-5">

    <label for="profilePic"
           class="block mb-2 text-sm font-medium text-heading">
        Profile Picture
    </label>

    <input type="file"
           id="profilePic"
           name="profilePic"
           accept="image/*"
           class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base block w-full px-3 py-2">

</div>

                <!-- Buttons -->
                <div class="flex gap-3">

                    <button type="submit"
                            class="text-white bg-blue-600 hover:bg-blue-700 font-medium rounded-lg text-sm px-5 py-2.5">
                        Save Changes
                    </button>

                    <a th:href="@{/profile}"
                       class="text-white bg-gray-600 hover:bg-gray-700 font-medium rounded-lg text-sm px-5 py-2.5">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

<script>
    console.log("Edit Profile Page");
</script>

</body>
</html>

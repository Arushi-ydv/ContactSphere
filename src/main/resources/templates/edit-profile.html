
<!DOCTYPE html>
<html lang="en"
      th:replace="~{base :: parent(~{::#content}, ~{::title}, ~{::script})}">

<head>
    <title>Edit Profile</title>
</head>

<body>

<div id="content">

    <div class="max-w-3xl mx-auto px-4 py-10 sm:py-12">

        <!-- Page Header -->
        <div class="mb-8">
            <a th:href="@{/profile}"
               class="inline-flex items-center gap-2 text-sm font-medium text-blue-600 dark:text-blue-400 hover:underline mb-5">
                ← Back to Profile
            </a>

            <p class="text-sm font-semibold uppercase tracking-wider text-blue-600 dark:text-blue-400 mb-2">
                Account Settings
            </p>

            <h1 class="text-3xl sm:text-4xl font-bold text-gray-900 dark:text-white">
                Edit Profile
            </h1>

            <p class="mt-2 text-gray-500 dark:text-gray-400">
                Update your personal information.
            </p>
        </div>

        <!-- Main Card -->
        <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl shadow-sm overflow-hidden">

            <div class="p-6 sm:p-8">

                <!-- Profile Information -->
                <div class="pb-7 mb-7 border-b border-gray-200 dark:border-gray-700">

                    <h2 class="text-xl font-bold text-gray-900 dark:text-white"
                        th:text="${user.name}">
                        User Name
                    </h2>

                    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">
                        Manage your personal profile information.
                    </p>

                </div>

                <!-- Edit Form -->
                <form th:action="@{/profile/update}"
                      method="post"
                      class="space-y-5">

                    <!-- CSRF Token -->
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <!-- Name -->
                    <div>
                        <label for="name"
                               class="block mb-2 text-sm font-semibold text-gray-700 dark:text-gray-300">
                            Full Name
                        </label>

                        <input type="text"
                               id="name"
                               name="name"
                               th:value="${user.name}"
                               required
                               placeholder="Enter your name"
                               class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    </div>

                    <!-- Email -->
                    <div>
                        <label for="email"
                               class="block mb-2 text-sm font-semibold text-gray-700 dark:text-gray-300">
                            Email Address
                        </label>

                        <input type="email"
                               id="email"
                               name="email"
                               th:value="${user.email}"
                               readonly
                               class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-100 dark:bg-gray-700/60 text-gray-500 dark:text-gray-400 cursor-not-allowed outline-none">

                        <p class="text-xs text-gray-500 dark:text-gray-400 mt-2">
                            Your registered email address cannot be changed here.
                        </p>
                    </div>

                    <!-- Phone Number -->
                    <div>
                        <label for="phoneNumber"
                               class="block mb-2 text-sm font-semibold text-gray-700 dark:text-gray-300">
                            Phone Number
                        </label>

                        <input type="text"
                               id="phoneNumber"
                               name="phoneNumber"
                               th:value="${user.phoneNumber}"
                               placeholder="Enter phone number"
                               class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    </div>

                    <!-- About -->
                    <div>
                        <label for="about"
                               class="block mb-2 text-sm font-semibold text-gray-700 dark:text-gray-300">
                            About Me
                        </label>

                        <textarea id="about"
                                  name="about"
                                  rows="4"
                                  placeholder="Tell something about yourself..."
                                  class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition resize-y"
                                  th:text="${user.about}"></textarea>
                    </div>

                    <!-- Buttons -->
                    <div class="border-t border-gray-200 dark:border-gray-700 pt-6 flex flex-col-reverse sm:flex-row gap-3">

                        <a th:href="@{/profile}"
                           class="inline-flex items-center justify-center px-6 py-3 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-800 dark:text-white font-semibold text-sm transition-colors">
                            Cancel
                        </a>

                        <button type="submit"
                                class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm transition-colors">
                            Save Changes
                        </button>

                    </div>

                </form>

            </div>
        </div>

    </div>

</div>

<script>
    console.log("Edit Profile Page");
</script>

</body>
</html>

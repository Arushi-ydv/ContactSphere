
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error | ContactSphere</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>

<body class="min-h-screen bg-gray-50 dark:bg-gray-900 flex items-center justify-center px-4 py-10">

    <div class="w-full max-w-lg">

        <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl shadow-xl p-8 sm:p-10 text-center">

            <!-- Error Icon -->
            <div class="w-24 h-24 mx-auto mb-6 flex items-center justify-center rounded-full bg-red-100 dark:bg-red-900/30">
                <svg class="w-12 h-12 text-red-600 dark:text-red-400"
                     fill="none"
                     stroke="currentColor"
                     viewBox="0 0 24 24"
                     xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z">
                    </path>
                </svg>
            </div>

            <!-- Error Heading -->
            <p class="text-sm font-semibold uppercase tracking-wider text-red-600 dark:text-red-400 mb-3">
                Something went wrong
            </p>

            <h1 class="text-4xl sm:text-5xl font-bold text-gray-900 dark:text-white mb-4">
                Oops!
            </h1>

            <h2 class="text-xl font-semibold text-gray-800 dark:text-gray-200 mb-3">
                We couldn't complete your request.
            </h2>

            <!-- Error Message -->
            <p class="text-gray-600 dark:text-gray-400 leading-relaxed mb-8 break-words"
               th:text="${errorMessage}">
                Something went wrong. Please try again.
            </p>

            <!-- Actions -->
            <div class="flex flex-col sm:flex-row justify-center gap-3">

                <a th:href="@{/dashboard}"
                   class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm transition-colors">
                    <span>←</span>
                    Back to Dashboard
                </a>

                <button type="button"
                        onclick="window.history.back()"
                        class="inline-flex items-center justify-center px-6 py-3 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-800 dark:text-white font-semibold text-sm transition-colors">
                    Go Back
                </button>

            </div>

        </div>

        <!-- Footer -->
        <p class="text-center text-sm text-gray-500 dark:text-gray-500 mt-6">
            © ContactSphere. All rights reserved.
        </p>

    </div>

</body>
</html>
